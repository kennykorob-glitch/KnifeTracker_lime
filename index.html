<style>
:root{--wood:#b79a73;--wl:rgba(72,46,20,.38);--wr:rgba(128,82,38,.22);--p1:#f4e8d0;--p2:#e2cfa9;--bd:#4a3624;--tx:#2c2013;--mut:#5e4630;--btn:#f7eeda;--sel:#4a3624;--seltx:#f7eeda;--pri:#a5601f;--pritx:#fff4e0;--ok:#2f6f3a;--bad:#a8321f;--c1:#a5601f;--c2:#3b6f8f;--c3:#4c7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wood:#3a2c20;--wl:rgba(0,0,0,.5);--wr:rgba(220,170,110,.14);--p1:#4a3a2c;--p2:#392c21;--bd:#150f0a;--tx:#f5e9d2;--mut:#cdb995;--btn:#5f4a37;--sel:#ead7b0;--seltx:#2a1e12;--pri:#d78f3f;--pritx:#24140a;--ok:#7bd08f;--bad:#ff9a85;--c1:#e3a053;--c2:#86c1e6;--c3:#93d08a;}}
:root[data-theme="dark"]{--wood:#3a2c20;--wl:rgba(0,0,0,.5);--wr:rgba(220,170,110,.14);--p1:#4a3a2c;--p2:#392c21;--bd:#150f0a;--tx:#f5e9d2;--mut:#cdb995;--btn:#5f4a37;--sel:#ead7b0;--seltx:#2a1e12;--pri:#d78f3f;--pritx:#24140a;--ok:#7bd08f;--bad:#ff9a85;--c1:#e3a053;--c2:#86c1e6;--c3:#93d08a;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:var(--tx);font:16px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;background-color:var(--wood)}
#app{max-width:560px;margin:0 auto;padding:10px;min-height:100%;display:flex;flex-direction:column;gap:8px}
h1{font-size:18px;margin:2px 0;text-align:center;text-transform:uppercase;letter-spacing:.05em;color:var(--seltx);background:var(--sel);border:2px solid var(--bd);border-radius:18px;padding:6px 10px}
h2{font-size:12px;margin:0 0 5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card{background:linear-gradient(180deg,var(--p1),var(--p2));border:2px solid var(--bd);border-radius:18px;padding:9px 12px}
.row{display:flex;gap:8px}
.row>*{flex:1}
button{font:inherit;font-weight:700;color:var(--tx);background:var(--btn);border:2px solid var(--bd);border-radius:18px;padding:9px;cursor:pointer;box-shadow:0 4px 0 var(--bd);transition:transform .05s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd);filter:brightness(.92)}
button:disabled{opacity:.45;box-shadow:none;transform:none;filter:none}
button.on,button.on:active{background:var(--sel);color:var(--seltx);transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(0,0,0,.55);filter:none}
.row>button.on::before{content:"\2713\00a0"}
button.main{background:var(--pri);color:var(--pritx);font-size:20px;padding:13px;text-transform:uppercase;letter-spacing:.04em}
button.main:active{filter:brightness(.9)}
button.main.alt{background:var(--btn);color:var(--tx)}
button.ghost,button.ghost:active{border-color:transparent;background:transparent;color:var(--tx);text-decoration:underline;box-shadow:none;transform:none;filter:none}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:42px;flex:none;font-size:20px;padding:5px}
.stepper .v{flex:1;text-align:center;font-size:24px;font-weight:700}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:8px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.18)}
.stat:last-child{border:0}
.big{font-size:40px;font-weight:800}
.hit{color:var(--ok)}.miss{color:var(--bad)}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:10px;flex:1;min-height:0}#app.tr{height:100%;overflow:hidden}
.grid button{font-size:inherit;font-weight:800;min-height:0;padding:0;border-radius:18px;background:var(--btn);box-shadow:0 5px 0 var(--bd)}
.grid button:active{background:var(--pri);color:var(--pritx);box-shadow:0 1px 0 var(--bd);filter:none}
.grid button.zero{color:var(--bad)}
.bar{height:14px;border-radius:18px;background:rgba(0,0,0,.15);border:2px solid var(--bd);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:6px}
.sum b{display:block;font-size:34px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:5px 4px;text-align:right}td:first-child,th:first-child{text-align:left}
th{color:var(--mut);font-weight:700}
.wl{font-size:12px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:4px}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;border:2px solid var(--bd);vertical-align:-1px}
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(35,115,58,.35);animation:fl 1.1s ease-out forwards;z-index:50}.flash.z{background:rgba(179,38,30,.3)}
.flash div{background:var(--p1);color:var(--ok);border:4px solid var(--bd);border-radius:50%;width:170px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:90px;font-weight:800;line-height:1}.flash small{font-size:22px;color:var(--tx);margin-top:4px}
@keyframes fl{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
textarea{width:100%;margin:8px 0;border:2px solid var(--bd);border-radius:18px;padding:8px;background:var(--btn);color:var(--tx);font:13px/1.3 monospace;resize:vertical}
.hscroll{max-height:342px;overflow-y:auto;border:2px solid var(--bd);border-radius:18px;background:var(--btn)}
.hscroll::-webkit-scrollbar{width:12px}.hscroll::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}.hscroll::-webkit-scrollbar-thumb{background:var(--sel);border-radius:6px;border:2px solid transparent;background-clip:content-box}
table.hist{font-size:13px}table.hist small{font-size:11px;opacity:.8}table.hist th{position:sticky;top:0;background:var(--p2);z-index:1}
table.hist td,table.hist th{white-space:nowrap;padding:5px 4px;line-height:20px}
tr.hr{cursor:pointer;border-bottom:1px solid rgba(0,0,0,.18)}tr.hr.arm td{background:rgba(179,38,30,.2)}
button.x{padding:2px 8px;font-size:14px;box-shadow:0 2px 0 var(--bd)}button.x.arm{background:#b3261e;color:#fff;border-color:var(--bd)}
tr.cf td{padding:4px 4px 8px;text-align:center}tr.cf button.x{width:100%;padding:8px;font-size:15px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{filter:saturate(.5) contrast(.65) brightness(.5)}}
:root[data-theme="dark"] body::before{filter:saturate(.5) contrast(.65) brightness(.5)}
#app>.mut,#app>.wl,.mainp>.mut{background:var(--p1);color:var(--tx);border:2px solid var(--bd);border-radius:18px;padding:3px 10px;align-self:center}
#app>.wl:empty,#app>.mut:empty{display:none}
@media (min-width:520px){html{background:#1c2226;overflow:hidden}body{width:407px;height:min(calc(100vh - 32px),810px);margin:16px auto;position:relative;overflow:hidden;transform:translateZ(0);border-radius:26px;box-shadow:0 0 0 8px #0b0e10}#app{height:100%;overflow-y:auto}}
#adbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;padding:6px 8px}
.adb{position:relative;height:56px;border:2px solid #1f3a5f;border-radius:8px;background:#fff7ea;color:#1b2430;overflow:hidden;cursor:pointer;font-family:"Segoe UI",Roboto,Arial,sans-serif}
.adb.set{height:112px;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(120deg,#fff7ea,#ffe3c2)}
.adl{position:absolute;top:2px;left:8px;font-size:9px;color:#6b7684}
.slide{display:flex;align-items:center;gap:8px;height:100%;padding:8px 10px 0;animation:sl .5s;cursor:default}
.slide .pic{width:68px;flex:none}.slide .pic svg{width:100%;display:block}
.slide .inf{flex:1;min-width:0;display:flex;flex-direction:column}.slide .inf b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide .pr{font-size:16px;font-weight:800;color:#c2570f}.slide .site{font-size:11px;color:#1f3a5f;font-weight:700;align-self:flex-end;margin-bottom:6px}
.dots{position:absolute;right:8px;top:5px;display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:#b9c2cd}.dots i.on{background:#e8742c}
@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.pl{width:64px;flex:none}.pq{width:88px;flex:none;border:2px solid #1f3a5f;border-radius:6px;overflow:hidden;background:#fff}.pq svg{display:block;width:100%}
.pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.2}.pm b{font-size:17px;letter-spacing:.06em;color:#1f3a5f}.pm span{font-size:13px;font-weight:700}
.pm .code{font-style:normal;font-weight:800;font-size:22px;letter-spacing:.08em;color:#fff;background:#e8742c;border:2px dashed #fff7ea;border-radius:6px;padding:4px 10px;align-self:flex-start}.pm span{font-size:15px;font-weight:700}.pm small{font-size:11px;color:#1f3a5f}
.fs{position:relative;overflow:hidden;border:3px solid #e8742c;border-radius:14px;background:linear-gradient(160deg,#1f3a5f,#13263f);color:#fff7ea;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.fs .fl{width:68px;animation:spin 8s linear infinite}.fsn{font-size:26px;font-weight:800;letter-spacing:.08em}.fss{font-size:13px;opacity:.85}
.scene{position:relative;width:100%;height:92px}.scene .tg{position:absolute;right:14px;top:4px;width:84px;animation:wob 2.6s infinite}
.scene .kn{position:absolute;right:56px;top:32px;width:140px;animation:fly 2.6s infinite}.scene .kn svg{display:block;width:100%}
.fsoff{font-size:54px;font-weight:900;color:#ff9a4d;line-height:1;animation:pls 1.4s ease-in-out infinite}
.fscode{border:2px dashed #e8742c;padding:4px 12px;border-radius:8px;font-size:16px}
.shopb{background:#e8742c;color:#fff;border:2px solid #fff7ea;border-radius:8px;font-size:18px;padding:10px 24px;box-shadow:0 4px 0 #8a3f0e}
.shoppic{width:200px}.shoppic svg{width:100%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{0%{transform:translateX(-330px) rotate(-25deg);opacity:0}10%{opacity:1}42%{transform:none}100%{transform:none}}
@keyframes wob{0%,44%{transform:none}50%{transform:rotate(7deg)}56%{transform:rotate(-5deg)}62%{transform:rotate(3deg)}70%,100%{transform:none}}
@keyframes pls{50%{transform:scale(1.12)}}

.hdr{display:flex;align-items:center;gap:10px}
button.back{width:48px;height:48px;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center}
h1.pt{flex:1;margin:0;font-size:28px;text-align:center;padding:6px 14px;letter-spacing:.03em}
.htabs{display:flex;align-items:flex-end;gap:4px;margin:2px 0 -10px;padding:0}
button.htab,button.htab:active{box-shadow:none;transform:none;filter:none;border-bottom:none;border-radius:18px 18px 0 0;padding:10px 14px;background:rgba(74,54,36,.8);color:#f7eeda}
button.htab.act,button.htab.act:active{background:var(--p1);color:var(--tx);position:relative;z-index:2}
button.htab:not(.act){margin-bottom:-10px;padding-bottom:20px}
button.htab{flex:1;position:relative;z-index:0}
.pnl{position:relative;z-index:1}.pnl.p0{border-radius:0 18px 18px 18px}.pnl.p1{border-radius:18px 0 18px 18px}
.acc{border-top:1px solid rgba(0,0,0,.25);margin-top:4px}
.ah{display:flex;align-items:center;gap:10px;padding:8px 0}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);flex:none}
.nm{flex:1;min-width:0;line-height:1.25;font-size:16px}.nm b{display:block}.nm span{font-size:14px;color:var(--mut)}
.ap{font-size:20px;font-weight:800}
button.chev{width:44px;height:44px;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center}
button.chev,button.chev:active{box-shadow:none}
button.chev,button.tr{border-radius:999px}button.tr.arm{border-radius:18px}
button.chev.open,button.chev.open:active{transform:rotate(180deg)}
.ab{padding:0 0 10px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hh h2{margin:0}
button.edb{padding:5px 12px;font-size:14px;box-shadow:0 3px 0 var(--bd)}
.hscroll{max-height:260px;border:none;border-radius:0;background:transparent}
.hrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,.65fr) minmax(0,1fr);align-items:center;gap:10px;min-height:52px;height:auto;box-sizing:border-box;padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.18);font-size:16px;line-height:1.25}.hrow>div{min-width:0;overflow-wrap:anywhere;word-break:normal}.hrow .mut{overflow-wrap:anywhere}.hrow.hrow3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}.hscroll.edit .hrow{grid-template-columns:minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,.65fr) minmax(0,1fr) auto}
.hrow .mut{color:var(--mut)}.rs{text-align:right}.hrow>div:nth-child(3){text-align:center}.hscroll.edit .hrow{grid-template-columns:1.15fr 1.1fr .65fr 1fr auto}
button.tr{display:none;width:40px;height:40px;padding:0;align-items:center;justify-content:center}
.hscroll.edit button.tr{display:inline-flex}
button.tr.arm{width:auto;padding:0 10px;background:#b3261e;color:#fff;font-size:14px}
.mdl{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.mbox{width:100%;max-width:300px;background:linear-gradient(180deg,var(--p1),var(--p2));border:2px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.mt{font-size:18px}.mm{font-size:14px;color:var(--mut)}
.mb{display:flex;flex-direction:column;gap:8px;margin-top:6px}.mb button{padding:11px;font-size:15px}
.mb button.pri{background:var(--pri);color:var(--pritx)}.mb button.dng{background:#b3261e;color:#fff}

.tline{font-size:15px;font-weight:600;color:var(--mut);text-align:center;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid rgba(0,0,0,.2)}
.tgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;align-items:center;text-align:center}
.tcap{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;line-height:1.2;padding-bottom:2px}
.tcap.tcb{grid-column:2/5}
.tv{font-size:28px;font-weight:800;line-height:1.2;white-space:nowrap}
.tv.pc{color:var(--mut);font-size:24px}
.tgrid>:nth-child(2),.tgrid>:nth-child(4){border-left:2px solid rgba(0,0,0,.2)}

.adl{right:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl img,.slide .pic img,.scene .kn img,.fs .fl img{width:100%;display:block}
.ban{position:absolute;inset:0}.ban img,.ban video{width:100%;height:100%;object-fit:cover;display:block}.ban.bs{animation:sl .5s}

.fsc{padding:0!important;border:none!important;background:none!important}

/* ЕДИНЫЙ ЗАГОЛОВОК СТРАНИЦЫ: одинаковый на всех экранах и не уплотняется */
#app .hdr{display:flex;align-items:center;gap:10px;flex:none;height:48px;margin:0}

.col{display:flex;flex-direction:column;gap:8px}

/* метание с двух рук: человечки на кнопках техники, четвёртый цвет графика */
:root{--c4:#8a4f7d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c4:#d6a3ca}}
:root[data-theme="dark"]{--c4:#d6a3ca}
button.tfig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:700;line-height:1.1;min-width:0}

body[data-fit="2"] button.tfig svg{width:30px;height:30px}
body[data-fit="3"] button.tfig svg{width:24px;height:24px}
body[data-fit="3"] button.tfig{padding:3px 2px}

button.tfig.on::before{position:absolute;top:2px;right:5px;font-size:11px;line-height:1;margin:0}
/* метание с двух рук: квадратики результата броска */
.thrs{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.thr-l{font-size:13px;font-weight:700;color:var(--mut);margin:0 0 3px 2px}
.thr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

button.sq .y{color:var(--ok)}
button.sq .n{color:var(--bad)}

/* iPhone / мобильные браузеры: страница не прокручивается сама, прокручивается только #app */

/* ---- подгонка по высоте: если страница не влезает без прокрутки, включаем уплотнение (3 уровня) ---- */
var fitOn=true;
function fit(on){
  $.classList.toggle('setp',!!$.querySelector('.sethdr'));
  if(on!==undefined)fitOn=on;
  var b=document.body;b.removeAttribute('data-fit');b.removeAttribute('data-tight');
  var th=$.querySelector('.thrs');
  if(th){th.classList.add('sized');th.style.setProperty('--sq','0px')}
  if(fitOn){var n=0;while(n<3&&$.scrollHeight>$.clientHeight+1){n++;b.setAttribute('data-fit',n)}}
  if(th){var s0=sizeSq(th);if(s0<64){b.setAttribute('data-tight','1');th.style.setProperty('--sq','0px');sizeSq(th)}}
}
/* кнопки результата (квадраты): сторона = min(ширина колонки, свободная высота / число рядов) */
function sizeSq(th){
  var rows=th.children,n=rows.length;if(!n)return;
  var cs=getComputedStyle(th),gap=parseFloat(cs.rowGap)||0,used=gap*(n-1);
  for(var i=0;i<n;i++)used+=rows[i].getBoundingClientRect().height;
  var avail=(th.clientHeight-used)/n,thr=th.querySelector('.thr'),g=parseFloat(getComputedStyle(thr).columnGap)||0;
  var w=(thr.clientWidth-3*g)/4,s=Math.floor(Math.max(30,Math.min(w,avail)));
  th.style.setProperty('--sq',s+'px');return s;
}

 {id:'cricket',name:'Крикет на ножах',sub:'Игра',
  info:'<p>Игра<br>Спортсмены по очереди метают по 3 ножа. В зависимости от варианта игры целью будет:</p><ul class="rl"><li>воткнуть нож в стенд с разных дистанций</li><li>воткнуть нож в мишень (лист А4, половина А4 и четверть А4)</li><li>воткнуть нож в стенд разными техниками</li></ul><p>Задача игрока закрыть все цели. Для закрытия нужно 3 успешных попадания. Если игрок закрыл цель, а его противник ещё нет, то следующие попадания в эту цель приносят очки.</p><p>Игра завершается в конце раунда, в котором один или оба игрока закрыли все цели. Победителем считается тот, у кого больше очков; при равенстве — закрывший все цели первым.</p><p>Описание выбранного варианта смотрите кнопкой «Правила» в настройках и во время игры.</p>'},
 {id:'points',name:'Мишени',sub:'Мишени М1 и №4, 3 ножа в подходе',
  info:'<p>Тренировка на очки: в подходе 3 ножа, за каждый нож вы отмечаете очки. Набор очков зависит от выбранной мишени.</p><p>Выбирается дистанция, рука и число подходов. После тренировки — итог и график очков по подходам, в статистике — динамика итоговых очков отдельно для правой и левой руки.</p><p class="mut" style="text-align:center;margin:0 0 4px;font-size:13px">Мишень М1</p><p style="text-align:center;margin-bottom:10px"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAR0AAAFACAIAAAAOGD8FAAAQAElEQVR4AeydC5yOVR7HmRnMGLdBSpbSqrbY0pKi60RbcitCCaVSaymSbrbLpra2C1vbnZUoFJZy2yYikVspbKk2sSoasnI347rfnI/HM++8M/O+816e8z7v7/kcx3nO8z/n/z+///md6xgph/QIgeRDYN26dTFtdEoZPUJACEQbAfEq2oiqPiFQpsxRXpXVIwSSBoETTjghFm11hpSjvHKylBAC1iCQqIaIV4nqOdltMwLilc3ekW2JioB4laiek902IyBe2ewd2ZaoCIhXieq58OyWdHwREK/ii3f42tLT0+vUqXPyySdnFXyqV69+5plnnnHGGQiEX6tKxBYB8Sq2+EZee9++fVeuXLl06dLVhZ4PP/xw7ty5HTp0iFyLaoguAuJVdPGMfm2nnHIKE1W1atWIq7qeKlWqVKxYMTMzs379+tHXqhojQ0C8igy/2Jf+7LPP9u7de+jQoe3btzM7vX/kmT179tSpU++9995Ro0bF3gppCA8B8So8vOIsXbZsWeallJSUAwcOvPfee506dWLV17Vr186dO5Po1q3b888/v2nTpjhbJXUlIiBelQiRxwL16tVLTU2FYMxaDzzwwIwZM2Ydfl5++eVGjRqRz1TmsYlSXwgB8aoQJDZlwJny5cszXxGYowYMGJCdnd20adOzzz67e/furAOZwSpUqGCTybLlFwTEq19QsPkPMxLmEUMwaLZr164tW7aw1yLz+OOPZ9Y67bTTSCtYhYB4ZZU7Ao2BTk7WwYMHp0+ffvXVV59//vmtWrVasGABORwQksNs5ogpYQMCXvHKhrYngA1paWnHHnsshu7bt+/VV19l7ccx4Ndff718+fKHHnpo//79fGrXrl2lSpVIKNiDgHhljy+CWMIx4DvvvJObmztt2rQ777wzLy+PHKYp4sWLF5OgDAcbLBFJKNiDgHhljy+CWAJz3njjjcaNG/fs2ZM9Fa9GiI2Wk2atqHWggcWeWLyyxxfBLWEFuHnz5j179sAfR4KT9zp16hg65efncwTvfFLCQwSaDPzJhJTvjjweWiPVRSEAc2rXrn3NNdfUqFHD4RUJztbvuece2MXElZOTw/qQzKIqUX74CERaIoXVuQmR1qTyMUAgPT399ddfHz169GeffcYtMDRDSbVq1W6++eabbroJXnF0MX/+fKYsCMYnBW8RWDbsGBO0DvTWESVo53yiXLly0IlZa+HChfPmzeMA4/PPP3/yySfNWQXp8ePHi1Ql4Bj3z+JV3CEPRyHT0eDBgzkPpFBmZmbz5s1bt24NxyAVe6q5c+e2bduWrRdfFaxCQLyyyh2BxjBfcZ5+2WWXcdrOtdWWLVu2bt36/fffL1my5LHHHmvfvv3GjRuRCSymd68REK+89kBJ+jkPZLHH0UV2dva55557zjnnnHfeecxaQ4YM2blzp+2kKql1fv0uXiWAZ9k+ser78ccf16xZ8+233/7www/MWmQmgOnJaqJ4la function modal(t,m,bs){var d=document.createElement('div');d.className='mdl';d.innerHTML='<div class="mbox"><b class="mt">'+t+'</b>'+(m?'<div class="mm">'+m+'</div>':'')+'<div class="mb">'+bs.map(function(b,i){return '<button class="'+(b.c||'')+'" data-i="'+i+'">'+b.t+'</button>'}).join('')+'</div></div>';d.onclick=function(e){if(e.target===d)d.remove()};d.querySelectorAll('button').forEach(function(el){el.onclick=function(){var b=bs[el.dataset.i];d.remove();if(b.f)b.f()}});document.body.appendChild(d)}
function rules(){
 var g=TR.filter(function(x){return x.id==='cricket'})[0].info.replace(/<p>Описание выбранного варианта[^]*?<\/p>/,'');
 modal('Крикет на ножах',g+'<p><b>Вариант «'+V[S.v].n+'»</b></p>'+V[S.v].r,[{t:'Закрыть',c:'pri'}])}
function endAsk(){modal('Прервать игру?','Текущий счёт будет удалён.',[{t:'Прервать',c:'dng',f:toMenu},{t:'Отмена',c:'ghost'}])}

function setup(){
 var T=V[S.v].T;
 var h=headBack('Крикет на ножах','Shell.toHub()')
 +'<div class="row">'+['dist','mish','tech'].map(function(k){return '<button class="'+(S.v===k?'on':'')+'" data-c="setV(\''+k+'\')">'+V[k].n+'</button>'}).join('')+'</div>'
 +'<div class="card"><div class="cvs">'+['dist','mish','tech'].map(function(k){var T=V[k].T;return '<div class="cv'+(S.v===k?' act':'')+'"><h2>'+V[k].n+'</h2><div class="cdesc" style="font-size:14px">'+V[k].d+'</div><table class="cost" style="margin-top:6px"><tr>'+T.map(function(x){return '<th>'+x[0]+'</th>'}).join('')+'</tr><tr>'+T.map(function(x){return '<td><b>'+x[1]+'</b></td>'}).join('')+'</tr></table><div class="mut" style="font-size:12px;text-align:center">'+(k==='tech'?'очков после закрытия':'очков за попадание')+'</div></div>'}).join('')+'</div></div>'
 +'<button class="main" data-c="startG()">Начать игру</button>'
 +'<button data-c="rules()">Правила</button>';
 return h;
}

function pips(m,i){var s='';for(var k=1;k<=3;k++)s+='<span class="pip'+(m>=k?' f'+i:'')+'"></span>';return '<div class="pips">'+s+'</div>'}

function cell(c,T,j,i,p){
 var m=c.m[i][j],dead=c.m[0][j]>=3&&c.m[1][j]>=3,cur=i===p,need=T[j][2]||1;
 if(dead)return '<div class="cell dead">✕</div>';
 var inner=m>=3?'+'+T[j][1]:pips(m,i),cls='cell'+(m>=3?' pts':'');
 return cur?'<button class="'+cls+'" data-c="hit('+j+')"'+(need>3-c.w.used?' disabled':'')+' aria-label="'+esc(T[j][0])+'">'+inner+'</button>':'<div class="'+cls+'">'+inner+'</div>';
}
function game(){
 var c=calc(),T=V[S.v].T,w=c.w,p=w.turn%2,who=w.turn%NP();
 if(c.over)return over(c);
 var h='<h1>'+V[S.v].n+'</h1><div class="scb">'+[0,1].map(function(i){return '<div class="plr'+(i===p?' cur':'')+'"><div class="n">'+tn(i)+'</div><div class="p">'+c.pts[i]+'</div></div>'}).join('')+'</div>';
 h+='<div class="card">'+T.map(function(t,j){
  var dead=c.m[0][j]>=3&&c.m[1][j]>=3;
  return '<div class="cr">'+cell(c,T,j,0,p)+'<div class="c">'+t[0]+'<small>'+(dead?'закрыта':t[1]+' оч.')+'</small></div>'+cell(c,T,j,1,p)+'</div>';
 }).join('')+'</div>';
 h+='<div class="mut">Бросает '+nm(who)+' · нож '+(w.used+1)+' из 3</div>';
 if(w.used===0&&S.th.length&&S.th[S.th.length-1]===-3)h+='<div class="wl">Последний нож предыдущего подхода пропущен: не осталось целей для одного ножа</div>';
 if(c.any)h+='<div class="wl">Все цели закрыты — игра закончится после подхода '+tn(1)+'</div>';
 if(S.v==='tech')h+='<div class="row"><button class="main alt" style="color:var(--bad)" data-c="hit(-1)">Мимо</button><button class="main alt" style="color:var(--bad)" data-c="hit(-2)"'+(w.used>1?' disabled':'')+'>Мимо ×2</button></div>';
 else h+='<button class="main alt" style="color:var(--bad)" data-c="hit(-1)">Мимо</button>';
 h+='<div class="row r3"><button data-c="undo()"'+(S.th.length?'':' disabled')+'>↶ Отменить</button><button data-c="rules()">Правила</button><button data-c="endAsk()">Прервать</button></div>';
 return h;
}

function over(c){
 var w=c.win;
 return '<h1>Игра окончена</h1><div class="card"><div class="mut" style="text-align:center">'+(S.fmt===2?'Победили':'Победил')+'</div><div class="big2">'+tn(w)+'</div>'
 +'<div class="sum" style="grid-template-columns:1fr 1fr;margin-top:10px">'+[0,1].map(function(i){return '<div><b'+(i===w?' class="hit"':'')+'>'+c.pts[i]+'</b><span class="mut">'+tn(i)+'</span></div>'}).join('')+'</div>'
 +(c.why?'<div class="mut" style="margin-top:10px;text-align:center;font-size:14px">'+esc(c.why)+'</div>':'')+'</div>'
 +'<div class="card"><h2>Закрытие целей</h2>'+V[S.v].T.map(function(t,j){return '<div class="stat"><span>'+t[0]+'</span><span>'+c.m[0][j]+' : '+c.m[1][j]+'</span></div>'}).join('')+'</div>'
 +'<button class="main" data-c="rematch()">Реванш</button><div class="row"><button data-c="undo()">↶ Отменить бросок</button><button data-c="toMenu()">В меню</button></div>';
}

function draw(){var g=S.run,ov=g&&calc().over;$.innerHTML=g?game():setup();banner(!g?'s':ov?'':'t');window.scrollTo(0,0);$.scrollTop=0;Shell.fit(true)}


API.appBack=function(){if(S.run){endAsk();return true}return false};
API.open=function(){draw()};
API.x=function(c,el){return (function(){return eval(c)}).call(el)};
API.hist=function(){return typeof hist!=='undefined'?hist:[]};
return API})();
MODS.points=(function(){var API={};
var ARW='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function headBack(t,fn){return '<div class="hdr'+(fn==='Shell.toHub()'?' sethdr':'')+'"><button class="back" data-c="'+fn+'" aria-label="Назад">'+ARW+'</button><h1 class="pt">'+t+'</h1></div>'}
var HAND=['Правая рука','Левая рука'],KN=3;
/* мишени: М1 — очки 0/5/10/15/20, №4 — 0/5/6/7/8/9/10; записи без поля tg относятся к М1 */
var TG=[{id:'m1',n:'М1',pts:[0,5,10,15,20],max:20},{id:'n4',n:'№4',pts:[0,5,6,7,8,9,10],max:10}];
function tg(x){return TG[x&&x.tg==='n4'?1:0]}
function maxSet(t){return t.max*KN}
var mem={};
function ld(k,d){try{var v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return mem[k]!==undefined?mem[k]:d}
function sv(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cfg=ld('kp_cfg',{dist:5,hand:0,sets:10,tg:'m1'}),hist=ld('kp_hist',[]);
if(cfg.tg!=='n4')cfg.tg='m1';
var scr='train',run=null,result=null,sHand=cfg.hand|0,$=document.getElementById('app'),lock=null;
function save(){sv('kp_cfg',cfg)}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function p2(n){return (n<10?'0':'')+n}
function fd(d){return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+p2(d.getFullYear()%100)}
function ft(d){return p2(d.getHours())+':'+p2(d.getMinutes())}
async function getLock(){try{if('wakeLock' in navigator)lock=await navigator.wakeLock.request('screen')}catch(e){}}
function freeLock(){try{if(lock)lock.release()}catch(e){}lock=null}
document.addEventListener('visibilitychange',function(){if(run&&document.visibilityState==='visible')getLock()});

function modal(t,m,bs){var d=document.createElement('div');d.className='mdl';d.innerHTML='<div class="mbox"><b style="font-size:18px">'+t+'</b>'+(m?'<div class="mm">'+m+'</div>':'')+'<div class="mb">'+bs.map(function(b,i){return '<button class="'+(b.c||'')+'" data-i="'+i+'">'+b.t+'</button>'}).join('')+'</div></div>';d.onclick=function(e){if(e.target===d)d.remove()};d.querySelectorAll('button').forEach(function(el){el.onclick=function(){var b=bs[el.dataset.i];d.remove();if(b.f)b.f()}});document.body.appendChild(d)}

/* ---------- chart ---------- */
function chart(vals,ymax,step,title,note){
  var W=320,H=135,pl=32,pr=10,pt=14,pb=18,iw=W-pl-pr,ih=H-pt-pb,o='',n=vals.length;
  for(var v=0;v<=ymax;v+=step){var y=pt+ih-ih*v/ymax;o+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--tx)" stroke-opacity=".25" stroke-dasharray="3 3"/><text x="'+(pl-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" style="fill:var(--mut)">'+v+'</text>'}
  var pts=vals.map(function(v,i){return [pl+(n>1?10+(iw-20)*i/(n-1):iw/2),pt+ih-ih*v/ymax]});
  if(n>1)o+='<polyline fill="none" stroke-width="3" stroke-linejoin="round" style="stroke:var(--c1)" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p,i){o+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" style="fill:var(--c1)"/>';
    if(n<=12)o+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]-8).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--tx)">'+vals[i]+'</text>';
    if(n<=15||i%5==4||i==0)o+='<text x="'+p[0].toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" style="fill:var(--mut)">'+(i+1)+'</text>'});
  return '<h2>'+title+'</h2><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+title+'">'+o+'</svg><div class="mut" style="font-size:12px">'+note+'</div>'}

function niceMax(m){var s=m>300?100:m>120?50:m>50?20:10;return Math.max(s,Math.ceil(m/s)*s)}
function tchart(ser){
  var W=320,H=135,pl=34,pr=10,pt=10,pb=8,iw=W-pl-pr,ih=H-pt-pb,o='',maxN=1,mx=0;
  ser.forEach(function(q){q.V=q.L.slice(-10);if(q.V.length>maxN)maxN=q.V.length;q.V.forEach(function(x){if(x.total>mx)mx=x.total})});
  var hi=niceMax(mx);
  [0,hi/2,hi].forEach(function(v){var y=pt+ih-ih*v/hi;o+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--tx)" stroke-opacity=".25" stroke-dasharray="3 3"/><text x="'+(pl-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" style="fill:var(--mut)">'+Math.round(v)+'</text>'});
  ser.forEach(function(q){
    var c='var(--c'+(q.i+1)+')',pts=q.V.map(function(x,i){return [pl+(maxN>1?10+(iw-20)*i/(maxN-1):iw/2),pt+ih-ih*x.total/hi]});
    if(pts.length>1)o+='<polyline fill="none" stroke-width="3" stroke-linejoin="round" style="stroke:'+c+'" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';
    pts.forEach(function(p){o+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" style="fill:'+c+'"/>'})});
  return '<h2>Итоговые очки по тренировкам</h2><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="График">'+o+'</svg>'}

/* ---------- setup ---------- */
function tgIcon(id,sz){
  var h='<svg viewBox="0 0 40 40" width="'+sz+'" height="'+sz+'" aria-hidden="true">';
  if(id==='n4')return h+'<defs><clipPath id="tgc"><path d="M13 2h14v11h12v26H1V13h12z"/></clipPath></defs><path d="M13 2h14v11h12v26H1V13h12z" fill="#2f6f3a"/><g clip-path="url(#tgc)" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="20" cy="22" r="4"/><circle cx="20" cy="22" r="8"/><circle cx="20" cy="22" r="12"/><circle cx="20" cy="22" r="16"/><circle cx="20" cy="22" r="20"/></g></svg>';
  return h+'<rect x="3" y="2" width="34" height="36" fill="#111"/><rect x="8" y="7" width="24" height="26" fill="#fff"/><rect x="12" y="11" width="16" height="18" fill="#111"/><rect x="16" y="15" width="8" height="10" fill="#fff"/></svg>'}
function home(){
  return headBack('Мишени','Shell.toHub()')+'<button class="main" data-c="gotoStats()">К статистике</button>'
  +'<div class="card"><h2>Мишень</h2><div class="row">'+TG.map(function(t){return '<button class="tfig tgb'+(cfg.tg==t.id?' on':'')+'" data-c="cfg.tg=\''+t.id+'\';save();draw()" aria-label="Мишень '+t.n+'">'+tgIcon(t.id,40)+'<span>'+t.n+'</span></button>'}).join('')+'</div></div>'
  +'<div class="card"><h2>Рука</h2><div class="row">'+HAND.map(function(n,i){return '<button class="'+(cfg.hand==i?'on':'')+'" data-c="cfg.hand='+i+';sHand='+i+';save();draw()">'+n+'</button>'}).join('')+'</div></div>'
  +'<div class="row srow"><div class="card"><h2>Дистанция</h2><div class="stepper"><button data-c="chg(\'dist\',-1)">−</button><div class="v">'+cfg.dist+' <small>м</small></div><button data-c="chg(\'dist\',1)">+</button></div></div>'
  +'<div class="card"><h2>Подходов <small>(по 3 ножа)</small></h2><div class="stepper"><button data-c="chg(\'sets\',-1)">−</button><div class="v">'+cfg.sets+'</div><button data-c="chg(\'sets\',1)">+</button></div></div></div>'
  +'<button class="main" data-c="start()">Начать тренировку</button>'}

function chg(k,d){var lim=k=='dist'?[1,30]:[1,50];cfg[k]=Math.max(lim[0],Math.min(lim[1],cfg[k]+d));save();draw()}
function go(s){scr=s;draw()}

/* ---------- training ---------- */
function start(){run={cfg:JSON.parse(JSON.stringify(cfg)),s:[],cur:[null,null,null]};getLock();draw()}
function total(){return run.s.reduce(function(a,s){return a+sum(s)},0)}
function train(){
  var c=run.cfg,n=run.s.length,last=n?sum(run.s[n-1]):'–',ready=run.cur.every(function(v){return v!==null}),h='';
  h+='<div class="card"><div class="tline">'+HAND[c.hand]+' · '+c.dist+' м · мишень '+tg(c).n+'</div><div class="tgrid"><div class="tcap">Подход</div><div class="tcap">Прошлый</div><div class="tcap">Всего очков</div><div class="tv">'+(n+1)+'/'+c.sets+'</div><div class="tv">'+last+'</div><div class="tv ok">'+total()+'</div></div></div>';
  for(var k=0;k<KN;k++){h+='<div class="pkn'+(tg(c).pts.length>5?' n7':'')+'"><span class="lab">Нож '+(k+1)+'</span><div class="row">'+tg(c).pts.map(function(p){return '<button class="'+(run.cur[k]===p?'on ':'')+(p==0?'z':'')+'" data-c="pick('+k+','+p+')">'+p+'</button>'}).join('')+'</div></div>'}
  h+='<button class="main" data-c="commit()"'+(ready?'':' disabled')+'>'+(ready?'Записать · '+sum(run.cur):'Отметьте все ножи')+'</button>';
  h+='<div class="row"><button data-c="undo()"'+(n?'':' disabled')+'>↶ Отменить</button><button data-c="endEarly()">Завершить</button></div>';
  return h}
function pick(k,p){run.cur[k]=run.cur[k]===p?null:p;try{if(navigator.vibrate)navigator.vibrate(15)}catch(e){}draw()}
function commit(){if(!run.cur.every(function(v){return v!==null}))return;run.s.push(run.cur.slice());run.cur=[null,null,null];if(run.s.length>=run.cfg.sets)finish();else draw()}
function undo(){if(!run.s.length)return;run.cur=run.s.pop();draw()}
function endEarly(){var n=run.s.length;if(!n){run=null;freeLock();draw();return}
  modal('Завершить тренировку?','Записано подходов: '+n+' из '+run.cfg.sets+'.',[{t:'Завершить и сохранить',c:'pri',f:finish},{t:'Завершить без сохранения',f:function(){run=null;freeLock();draw()}},{t:'Отмена',c:'ghost'}])}
function finish(){
  var r={d:Date.now(),hand:run.cfg.hand,dist:run.cfg.dist,tg:run.cfg.tg,sets:run.s.length,s:run.s,total:total()};
  hist.push(r);sv('kp_hist',hist);sHand=r.hand;result=r;run=null;freeLock();draw()}

/* ---------- result ---------- */
function res(){
  var r=result,t=tg(r),sums=r.s.map(sum),max=r.sets*maxSet(t),best=Math.max.apply(null,sums);
  return headBack('Итоги',"result=null;scr='train';draw()")+'<div class="card"><div class="mut">'+HAND[r.hand]+' · '+r.dist+' м · мишень '+t.n+' · '+fd(new Date(r.d))+'</div>'
  +'<div class="mut">Итого очков</div><div class="big" style="font-size:44px">'+r.total+' <small class="mut" style="font-size:22px">из '+max+'</small></div></div>'
  +'<div class="card">'+chart(sums,maxSet(t),t.max===20?20:10,'Очки по подходам','По горизонтали — номер подхода')+'</div>'
  +'<div class="card sum"><div><b>'+Math.round(r.total/r.sets)+'</b><span class="mut">в среднем за подход</span></div><div><b>'+best+'</b><span class="mut">лучший подход</span></div><div><b>'+Math.round(r.total*100/max)+'%</b><span class="mut">от максимума</span></div></div>'
  +'<div class="col"><button class="main" data-c="result=null;scr=\'train\';draw()">Новая</button><button class="main" data-c="result=null;scr=\'train\';gotoStats()">К статистике</button></div>'}

/* ---------- stats ---------- */
function SH(){return hist.filter(function(x){return x.hand==sHand})}
function stats(){
  var h=headBack('Статистика',"go('train')")+'<button class="main" data-c="go(\'train\')">К тренировке</button>';
  h+='<div class="tabs">'+HAND.map(function(n,i){return '<button class="'+(sHand==i?'act':'')+'" data-c="sHand='+i+';draw()">'+n+'</button>'}).join('')+'</div>';
  var A=SH();
  if(!A.length)return h+'<div class="card pnl mut">Для этой руки пока нет сохранённых тренировок.</div>';
  var ser=[];TG.forEach(function(t,ti){var L=A.filter(function(x){return tg(x)===t});if(L.length)ser.push({t:t,i:ti,L:L})});
  h+='<div class="card pnl">'+tchart(ser);
  ser.forEach(function(q){var tt=0,ss=0;q.L.forEach(function(x){tt+=x.total;ss+=x.sets});
    var avg=ss?Math.round(tt/ss):'–';
    var op=!!openAcc[q.i],D={},ds=[];q.L.forEach(function(x){if(!D[x.dist]){D[x.dist]=[];ds.push(x.dist)}D[x.dist].push(x)});ds.sort(function(a,b){return a-b});
    h+='<div class="acc"><div class="ah"><i class="dot" style="background:var(--c'+(q.i+1)+')"></i><div class="nm"><b>Мишень '+q.t.n+'</b><span>'+(ss*KN)+' бросков</span></div><span class="ap" style="text-align:right">'+avg+'<small style="display:block;font-size:12px;font-weight:600;color:var(--mut)">Сред. бал</small></span><button class="chev'+(op?' open':'')+'" data-c="togAcc('+q.i+',this)" aria-label="Развернуть">'+CHV+'</button></div><div class="ab" id="ab'+q.i+'" style="display:'+(op?'block':'none')+'"><table style="margin-top:4px"><tr><th>Дистанция</th><th>Бросков</th><th>Сред. бал</th></tr>'+ds.map(function(d){var s1=0,t1=0;D[d].forEach(function(x){s1+=x.sets;t1+=x.total});return '<tr><td>'+d+' м</td><td>'+(s1*KN)+'</td><td><b>'+(s1?Math.round(t1/s1)+' из '+(q.t.id==='m1'?60:30):'–')+'</b></td></tr>'}).join('')+'</table></div></div>'});
  h+='</div>';
